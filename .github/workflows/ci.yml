name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest -q

      # Dependency-vulnerability audit. Informational (continue-on-error) on
      # purpose: requirements.txt uses floor pins (e.g. Flask>=3.0), so a new
      # CVE in a transitive dependency would fail every build here even when
      # nothing in this demo repo can act on it. Visibility is still the point
      # — the portfolio's SECURITY_AND_EFFICIENCY doc lists unaudited
      # dependencies as a known gap, and this step closes it: findings show up
      # in the job log for triage instead of silently not existing. Actionable
      # findings get fixed by bumping the floor pin in requirements.txt.
      - name: Audit dependencies (pip-audit, informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.txt --strict
